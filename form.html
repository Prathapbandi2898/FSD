<!DOCTYPE html>
<html>
<head>
    <title>Two Month Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Two Month Table</h2>

<table>
    <tr>
        <th>Month</th>
        <th>Day</th>
        <th>Notes</th>
    </tr>

    <!-- March -->
    <tr><td rowspan="5">March</td><td>1</td><td></td></tr>
    <tr><td>2</td><td></td></tr>
    <tr><td>3</td><td></td></tr>
    <tr><td>4</td><td></td></tr>
    <tr><td>5</td><td></td></tr>

    <!-- April -->
    <tr><td rowspan="5">April</td><td>1</td><td></td></tr>
    <tr><td>2</td><td></td></tr>
    <tr><td>3</td><td></td></tr>
    <tr><td>4</td><td></td></tr>
    <tr><td>5</td><td></td></tr>

</table>

</body>
</html>
